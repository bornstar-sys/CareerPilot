[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot"
version = "0.1.0"
description = "Agentic AI Career and Interview Assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "groq==1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["careerpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
